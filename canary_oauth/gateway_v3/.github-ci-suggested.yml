name: C-Lab OAuth Gateway V1 isolated check
on:
  workflow_dispatch:
  push:
    branches: [c-lab-oauth-gateway-v1-20261028]
    paths:
      - 'canary_oauth/gateway_v1/**'
      - '.github/workflows/clab-oauth-gateway-v1.yml'
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run full gateway tests
        working-directory: canary_oauth/gateway_v1
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt 'pytest>=8,<10'
          PYTHONPATH=. python -m pytest -q
      - name: Build immutable candidate image (no deployment)
        working-directory: canary_oauth/gateway_v1
        env:
          IMAGE: ghcr.io/donaldshim/clab-oauth-gateway
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull -t "$IMAGE:sha-$COMMIT" .
          docker inspect "$IMAGE:sha-$COMMIT" >/dev/null
      - name: Publish image after all gates pass
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/donaldshim/clab-oauth-gateway
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker push "$IMAGE:sha-$COMMIT" | tee /tmp/clab-oauth-push.log
          grep -Eq 'digest: sha256:[0-9a-f]{64}' /tmp/clab-oauth-push.log
          docker logout ghcr.io
